{% extends "base.html" %}

{% block content %}

{% if error %}
<div class="alert alert-warning">
    {{ error }}
</div>
{% endif %}

<h2 class="mb-4">Create Referral Post</h2>

<div class="card shadow-sm p-4">
<form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Company</label>
        <input type="text" class="form-control" value="{{ company }}" disabled>
    </div>

    <div class="mb-3">
        <label class="form-label">Official Job ID (Company Portal)</label>
        <input type="text" name="job_id" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Job Title</label>
        <input type="text" name="job_title" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="4" required></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Available Slots</label>
        <input type="number" name="available_slots" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-success">
        Create Post
    </button>
</form>
</div>

{% endblock %}
