<!DOCTYPE html>
<html>
<head>
    <title>Referral Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">Referral Portal</a>

    <div>
      {% if user.is_authenticated %}
        <a class="btn btn-outline-light btn-sm me-2" href="{% url 'profile' %}">Profile</a>
        <a class="btn btn-danger btn-sm" href="{% url 'logout' %}">Logout</a>
      {% else %}
        <a class="btn btn-outline-light btn-sm me-2" href="{% url 'login' %}">Login</a>
        <a class="btn btn-success btn-sm" href="{% url 'signup' %}">Create Account</a>
      {% endif %}
    </div>
  </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
